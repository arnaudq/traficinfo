name: Check and deploy webapp

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'mapconfig.json'
      - 'dsconfig.json'
      - 'LICENSE'
      - '.github/workflows/deploy-webapp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'mapconfig.json'
      - 'dsconfig.json'
      - 'LICENSE'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install recorded dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run lint
      - name: Test boundary configuration
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Build website
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
